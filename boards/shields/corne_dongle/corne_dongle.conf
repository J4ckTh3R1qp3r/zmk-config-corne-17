# The dongle is the only device connected to the host.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Give the two split links separate 15 ms radio slots and do not permit slave
# latency while diagnosing dropped key events. The dongle is USB powered.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# Bursts from both halves must not overflow the central event queue.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
